<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YouTube Plejliste – pretraga</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; margin:0; background:#111; color:#eee; }
    .wrap { max-width:900px; margin:auto; padding:18px; }
    h1 { font-size:1.45rem; margin:0 0 8px; }
    p { line-height:1.45; }
    .card { background:#1b1b1b; border:1px solid #333; border-radius:14px; padding:14px; margin:14px 0; }
    input,button { font:inherit; }
    input { width:100%; box-sizing:border-box; padding:12px; border-radius:10px; border:1px solid #555; background:#0f0f0f; color:#fff; }
    button { padding:11px 14px; border:0; border-radius:10px; margin:8px 6px 0 0; cursor:pointer; }
    .primary { background:#3b82f6; color:#fff; }
    .secondary { background:#333; color:#fff; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .small { font-size:.9rem; color:#bbb; }
    .status { margin-top:10px; white-space:pre-wrap; color:#d5d5d5; }
    .result { border-top:1px solid #333; padding:12px 0; }
    .result:first-child { border-top:0; }
    .title { font-weight:700; }
    .meta { color:#bbb; font-size:.9rem; margin-top:4px; }
    a { color:#8ab4f8; text-decoration:none; }
    .pill { display:inline-block; background:#2a2a2a; border-radius:999px; padding:3px 8px; margin:3px 4px 0 0; font-size:.85rem; }
    .hidden { display:none; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>🔎 Pretraga mojih YouTube plejlista</h1>
  <p class="small">Pretražuje naslove videa u tvojim privatnim i javnim plejlistama. Pristup traje samo dok važi Google pristupni token.</p>

  <div class="card">
    <label for="clientId"><b>Google OAuth Web Client ID</b></label>
    <input id="clientId" placeholder="…apps.googleusercontent.com" autocomplete="off">
    <button class="secondary" id="saveClient">Sačuvaj Client ID</button>
    <button class="primary" id="connectBtn">Poveži YouTube</button>
    <div class="status" id="status">Nije povezano.</div>
  </div>

  <div class="card">
    <label for="query"><b>Fraza za pretragu</b></label>
    <input id="query" placeholder="npr. špageti carbonara" disabled>
    <button class="primary" id="searchBtn" disabled>Pretraži</button>
    <button class="secondary" id="reloadBtn" disabled>Ponovo učitaj plejliste</button>
    <div class="small" id="count"></div>
  </div>

  <div class="card hidden" id="resultsCard"><div id="results"></div></div>
</div>

<script>
const SCOPE = 'https://www.googleapis.com/auth/youtube.readonly';
const REDIRECT_URI = 'https://zeljko069-beep.github.io/youtube-playliste/';
let accessToken = null;
let allItems = [];
let playlists = [];
const $ = id => document.getElementById(id);

function norm(s='') {
  return s.toLocaleLowerCase('sr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
}
function setStatus(msg){ $('status').textContent = msg; }
$('clientId').value = localStorage.getItem('yt_client_id') || '';

$('saveClient').onclick = () => {
  const id = $('clientId').value.trim();
  if (!id.endsWith('.apps.googleusercontent.com')) {
    alert('Client ID treba da se završava sa .apps.googleusercontent.com');
    return;
  }
  localStorage.setItem('yt_client_id', id);
  setStatus('Client ID sačuvan na ovom telefonu.');
};

function makeState() {
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => b.toString(16).padStart(2,'0')).join('');
}

$('connectBtn').onclick = () => {
  const clientId = $('clientId').value.trim();
  if (!clientId) { setStatus('Prvo unesi i sačuvaj Google OAuth Web Client ID.'); return; }
  const state = makeState();
  sessionStorage.setItem('yt_oauth_state', state);
  const u = new URL('https://accounts.google.com/o/oauth2/v2/auth');
  u.searchParams.set('client_id', clientId);
  u.searchParams.set('redirect_uri', REDIRECT_URI);
  u.searchParams.set('response_type', 'token');
  u.searchParams.set('scope', SCOPE);
  u.searchParams.set('include_granted_scopes', 'true');
  u.searchParams.set('state', state);
  u.searchParams.set('prompt', 'consent');
  location.assign(u.toString());
};

function readOAuthResponse() {
  if (!location.hash) return false;
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('error')) {
    setStatus('Google prijava nije uspjela: ' + p.get('error'));
    history.replaceState(null, '', REDIRECT_URI);
    return true;
  }
  const token = p.get('access_token');
  if (!token) return false;
  const returnedState = p.get('state') || '';
  const expectedState = sessionStorage.getItem('yt_oauth_state') || '';
  if (!expectedState || returnedState !== expectedState) {
    setStatus('Sigurnosna provjera prijave nije prošla. Pritisni ponovo „Poveži YouTube“.');
    history.replaceState(null, '', REDIRECT_URI);
    return true;
  }
  sessionStorage.removeItem('yt_oauth_state');
  accessToken = token;
  history.replaceState(null, '', REDIRECT_URI);
  setStatus('Povezano. Učitavam plejliste…');
  loadAll().catch(e => setStatus('Greška: ' + e.message));
  return true;
}

async function yt(path, params={}) {
  const u = new URL('https://www.googleapis.com/youtube/v3/' + path);
  Object.entries(params).forEach(([k,v]) => u.searchParams.set(k,v));
  const r = await fetch(u, {headers:{Authorization:'Bearer ' + accessToken}});
  if (!r.ok) {
    let detail = '';
    try { detail = (await r.json()).error?.message || ''; } catch {}
    if (r.status === 401) throw new Error('Pristup je istekao. Pritisni „Poveži YouTube“ ponovo.');
    throw new Error(`${path}: ${r.status} ${detail}`);
  }
  return r.json();
}

async function getOwnedPlaylists() {
  const out = [];
  let pageToken = '';
  do {
    const data = await yt('playlists', {part:'snippet,contentDetails,status', mine:'true', maxResults:'50', ...(pageToken ? {pageToken} : {})});
    for (const p of data.items || []) out.push({id:p.id, title:p.snippet?.title || '(bez naziva)', privacy:p.status?.privacyStatus || ''});
    pageToken = data.nextPageToken || '';
  } while(pageToken);
  try {
    const ch = await yt('channels', {part:'contentDetails', mine:'true', maxResults:'1'});
    const likes = ch.items?.[0]?.contentDetails?.relatedPlaylists?.likes;
    if (likes && !out.some(p => p.id === likes)) out.push({id:likes, title:'Lajkovani videi', privacy:'private'});
  } catch {}
  return out;
}

async function getPlaylistItems(pl) {
  const out = [];
  let pageToken = '';
  do {
    const data = await yt('playlistItems', {part:'snippet,contentDetails', playlistId:pl.id, maxResults:'50', ...(pageToken ? {pageToken} : {})});
    for (const it of data.items || []) {
      const vid = it.contentDetails?.videoId || it.snippet?.resourceId?.videoId;
      const title = it.snippet?.title || '';
      if (!vid || !title || title === 'Deleted video' || title === 'Private video') continue;
      out.push({videoId:vid, title, channel:it.snippet?.videoOwnerChannelTitle || '', playlistId:pl.id, playlist:pl.title});
    }
    pageToken = data.nextPageToken || '';
  } while(pageToken);
  return out;
}

async function loadAll() {
  $('query').disabled = true;
  $('searchBtn').disabled = true;
  $('reloadBtn').disabled = true;
  allItems = [];
  playlists = await getOwnedPlaylists();
  setStatus(`Pronađeno ${playlists.length} plejlista. Učitavam videe…`);
  let done = 0, skipped = 0;
  for (const pl of playlists) {
    try { allItems.push(...await getPlaylistItems(pl)); }
    catch (e) { skipped++; console.warn('Preskočena plejlista', pl.title, e); }
    done++;
    setStatus(`Učitavanje: ${done}/${playlists.length} plejlista • ${allItems.length} videa`);
  }
  setStatus(`Spremno: ${playlists.length} plejlista • ${allItems.length} videa${skipped ? ` • preskočeno ${skipped} lista` : ''}.`);
  $('query').disabled = false;
  $('searchBtn').disabled = false;
  $('reloadBtn').disabled = false;
}

$('reloadBtn').onclick = () => {
  if (!accessToken) { setStatus('Prvo poveži YouTube.'); return; }
  loadAll().catch(e => setStatus('Greška: ' + e.message));
};

function escapeHtml(s='') {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderSearch() {
  const q = norm($('query').value);
  $('results').innerHTML = '';
  $('resultsCard').classList.remove('hidden');
  if (!q) { $('count').textContent = 'Upiši frazu za pretragu.'; return; }
  const words = q.split(' ').filter(Boolean);
  const matches = allItems.filter(x => {
    const hay = norm(`${x.title} ${x.channel} ${x.playlist}`);
    return words.every(w => hay.includes(w));
  });
  $('count').textContent = `Rezultata: ${matches.length}`;
  if (!matches.length) { $('results').innerHTML = '<div class="small">Nema rezultata.</div>'; return; }
  const grouped = new Map();
  for (const m of matches) {
    const g = grouped.get(m.videoId) || {videoId:m.videoId, title:m.title, channel:m.channel, playlists:[]};
    if (!g.playlists.includes(m.playlist)) g.playlists.push(m.playlist);
    grouped.set(m.videoId, g);
  }
  for (const g of grouped.values()) {
    const div = document.createElement('div');
    div.className = 'result';
    const pls = g.playlists.map(p => `<span class="pill">${escapeHtml(p)}</span>`).join('');
    div.innerHTML = `<div class="title"><a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${encodeURIComponent(g.videoId)}">${escapeHtml(g.title)}</a></div><div class="meta">${escapeHtml(g.channel || '')}</div><div>${pls}</div>`;
    $('results').appendChild(div);
  }
}

$('searchBtn').onclick = renderSearch;
$('query').addEventListener('keydown', e => { if (e.key === 'Enter') renderSearch(); });
readOAuthResponse();
</script>
</body>
</html>
